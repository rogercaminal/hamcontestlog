[project]
name = "hamcontestlog"
version = "0.1.0"
description = "Ingest, enrich, score, and analyze amateur radio contest logs with DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roger Caminal" }]
dependencies = [
  "duckdb>=0.9",
  "click>=8.1",
  "pyyaml>=6",
  "requests>=2.31",
  "pyhamtools>=0.11",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.0",
  "pytest>=7.0",
]

[project.scripts]
hamcontestlog = "hamcontestlog.cli:main"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"
